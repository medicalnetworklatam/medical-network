<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@100..125,300..800&family=Figtree:wght@300..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }

  /* Hide scrollbars everywhere; scrolling itself still works */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }

  body {
    background: #EEF9F5;
    color: #121413;
    font-family: 'Archivo', sans-serif;
  }

  .page { padding: 28px 64px 56px; }

  .container {
    max-width: 1312px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 56px;
  }

  /* 1. Header */
  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    margin: 0;
    font-family: soleil, 'Figtree', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .menu-btn {
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 12px;
    color: #121413;
    text-decoration: none;
  }
  .menu-btn:hover { border-color: #489E85; }
  .menu-btn:focus-visible { outline: 3px solid #489E85; outline-offset: 2px; }

  /* 2. Hero */
  .hero {
    display: flex;
    flex-wrap: wrap;
    gap: 64px;
    align-items: flex-end;
  }

  .hero-text {
    flex: 3 1 560px;
    min-width: 0;
  }

  .hero-title {
    container-type: inline-size;
    margin: 0;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.05;
    text-align: justify;
    text-align-last: justify;
    hyphens: none;
  }

  .hero-title .line { display: block; }
  .hero-title .line-1 { font-size: calc(100cqw / 9.85); }
  .hero-title .line-2,
  .hero-title .line-3 { font-size: calc(100cqw / 7.5); }

  .chart {
    flex: 2 1 360px;
    min-width: 0;
    height: 310px;
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }

  .bar { flex: 1 1 0; border-radius: 8px; }
  .bar-1 { height: 16%;  background: #CAE8E6; }
  .bar-2 { height: 39%;  background: #7CDC92; }
  .bar-3 { height: 69%;  background: #489E85; }
  .bar-4 { height: 100%; background: #121413; }

  /* 3. Cards */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }

  .card {
    height: 280px;
    border-radius: 20px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card p { margin: 0; }

  .card-main {
    flex: 2 1 480px;
    background: #489E85;
    color: #121413;
    font-size: 18px;
    font-weight: 500;
  }

  .card-box-1 {
    flex: 1 1 220px;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    font-size: 16px;
  }

  .card-box-2 {
    flex: 1 1 220px;
    background: #121413;
    color: #B2F2E2;
    font-size: 16px;
  }

  /* Small screens: tighter outer padding so the content keeps its width */
  @media (max-width: 700px) {
    .page { padding: 20px 20px 40px; }
    .container { gap: 40px; }
    .hero { gap: 40px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="container">

      <header class="site-header">
        <p class="brand">Medical Network</p>
        <a class="menu-btn" href="estados.html" aria-label="Abrir menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </a>
      </header>

      <main>
        <div class="container">
          <section class="hero">
            <div class="hero-text">
              <h1 class="hero-title">
                <span class="line line-1">Ser médico ya es difícil,</span>
                <span class="line line-2">No te preocupes</span>
                <span class="line line-3">por la burocracia</span>
              </h1>
            </div>
            <div class="chart" aria-hidden="true">
              <div class="bar bar-1"></div>
              <div class="bar bar-2"></div>
              <div class="bar bar-3"></div>
              <div class="bar bar-4"></div>
            </div>
          </section>

          <section class="cards">
            <div class="card card-main"><p>[Main content block]</p></div>
            <div class="card card-box-1"><p>[Box 1]</p></div>
            <div class="card card-box-2"><p>[Box 2]</p></div>
          </section>
        </div>
      </main>

    </div>
  </div>
</body>
</html>
