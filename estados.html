<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estados · Medical Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@300..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }

  /* Hide scrollbars everywhere; scrolling itself still works */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }

  body {
    background: #EEF9F5;
    color: #121413;
    font-family: 'Figtree', sans-serif;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .page { padding: 28px 64px 28px; }

  .container {
    max-width: 1312px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .content {
    display: flex;
    flex-direction: column;
    gap: 24px;
    /* Map height: as tall as the screen allows (minus the room the rest of
       the page needs), but never taller than the drawing needs at this
       width. --map-ratio = height / width of the drawing. */
    --map-reserve: 390px;
    --map-ratio: 0.755;
    --map-room: min(100vw - 128px, 1312px);
    --map-h: min(max(420px, calc(100vh - var(--map-reserve))), calc(var(--map-room) * var(--map-ratio)));
  }
  .content { --map-reserve: 468px; }

  /* 1. Header (same as index.html) */
  .site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    margin: 0;
    font-family: soleil, 'Figtree', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: #121413;
    text-decoration: none;
  }
  .brand:focus-visible { outline: 3px solid #489E85; outline-offset: 4px; border-radius: 4px; }

  .menu-btn {
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 12px;
    color: #121413;
    text-decoration: none;
  }
  .menu-btn:hover { border-color: #489E85; }
  .menu-btn:focus-visible { outline: 3px solid #489E85; outline-offset: 2px; }

  /* 2. Question */
  .intro { text-align: center; }

  .page-title {
    margin: 0 auto;
    max-width: 24ch;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(36px, 4vw, 58px);
    line-height: 1.05;
    text-transform: uppercase;
    color: #2F7A64;
    text-wrap: balance;
  }

  .hint {
    margin: 12px 0 0;
    font-size: 17px;
    color: #3D4A46;
  }

  /* 3. Map */
  .map {
    display: block;
    width: 100%;
    height: var(--map-h);
    overflow: visible;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .state {
    fill: #FFFFFF;
    fill-rule: evenodd;
    stroke: #489E85;
    stroke-width: 2.5;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    cursor: pointer;
    transition: fill 160ms ease;
  }
  .state:focus { outline: none; }
  .state[aria-checked="true"] { fill: #7CDC92; }

  @media (hover: hover) {
    .state.is-hover { fill: #CAE8E6; }
    .state[aria-checked="true"].is-hover { fill: #6CCB83; }
  }

  /* Bigger invisible tap areas for Berlin, Bremen and Hamburg */
  .hit { fill: transparent; cursor: pointer; }

  /* Selecting: the green grows as a circle from the black dot, cut to the
     state's outline, until it fills the whole state. Meanwhile the state
     itself keeps its unselected colour (is-flooding). */
  .floods { pointer-events: none; }
  .flood-circle {
    fill: #7CDC92;
    transform-box: fill-box;
    transform-origin: center;
    animation: flood 550ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes flood { from { transform: scale(0); } to { transform: scale(1); } }
  /* Unselecting: the same thing backwards (mirrored easing curve), the
     green shrinks back into the dot */
  .flood-circle.is-shrinking {
    animation-name: unflood;
    animation-timing-function: cubic-bezier(0.8, 0, 0.6, 1);
  }
  @keyframes unflood { from { transform: scale(1); } to { transform: scale(0); } }
  .flood-outline {
    fill: none;
    stroke: #489E85;
    stroke-width: 2.5;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .state.is-flooding { fill: #FFFFFF; }
  @media (hover: hover) {
    .state.is-flooding.is-hover { fill: #CAE8E6; }
  }

  /* Keyboard focus: drawn on top so neighbours never hide it */
  .focus-ring {
    fill: none;
    stroke: #121413;
    stroke-width: 3;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    pointer-events: none;
    visibility: hidden;
  }
  .focus-ring.is-on { visibility: visible; }

  /* Names with a line, like the sketch */
  .leader {
    fill: none;
    stroke: #121413;
    stroke-width: 2.5;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    pointer-events: none;
  }
  .leader.is-drawing {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw-line 420ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes draw-line { to { stroke-dashoffset: 0; } }

  .dot {
    fill: #121413;
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
  }
  .dot.is-new { animation: pop 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .label { cursor: pointer; }
  .label text {
    font-family: 'Figtree', sans-serif;
    font-size: 24px;
    font-weight: 600;
    fill: #121413;
  }
  .label:hover text { fill: #2F7A64; }
  .label-hit { fill: transparent; }
  .label.is-new { animation: fade-in 260ms 180ms ease both; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* Unselecting = the selecting animation played backwards: the same 440ms
     timeline mirrored (name fades out, line pulls back into the dot, dot
     shrinks away), each easing curve flipped. Own keyframe names on purpose:
     re-using fade-in/draw-line/pop would not restart a finished animation. */
  .label.is-leaving {
    pointer-events: none;
    animation: fade-out 260ms 0ms cubic-bezier(0.75, 0, 0.75, 0.9) both;
  }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  .leader.is-undrawing {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
    animation: undraw-line 420ms 20ms cubic-bezier(0.8, 0, 0.8, 0.2) both;
  }
  @keyframes undraw-line { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1; } }
  .dot.is-leaving { animation: pop-out 260ms 180ms cubic-bezier(0.8, 0, 0.8, 0.2) both; }
  @keyframes pop-out { from { transform: scale(1); } to { transform: scale(0); } }

  /* Option C: search by city */
  .search {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 26px;
    transform: translateY(-50%);
    color: #3D4A46;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    height: 52px;
    padding: 0 16px 0 48px;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 12px;
    font-family: 'Figtree', sans-serif;
    font-size: 16px;
    color: #121413;
  }
  .search-input::placeholder { color: #3D4A46; }
  .search-input:hover { border-color: #489E85; }
  .search-input:focus-visible { outline: 2px solid #489E85; outline-offset: 2px; }

  .suggestions {
    position: absolute;
    z-index: 6;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    margin: 0;
    padding: 6px;
    list-style: none;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(18, 20, 19, 0.12);
  }
  .suggestion {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .suggestion[aria-selected="true"] { background: #EEF9F5; }
  @media (hover: hover) { .suggestion:hover { background: #EEF9F5; } }
  .suggestion-city { font-size: 16px; font-weight: 600; }
  .suggestion-alias { font-weight: 400; color: #3D4A46; }
  .suggestion-state {
    font-size: 14px;
    font-weight: 600;
    color: #2F7A64;
    text-align: right;
  }
  .suggestion-empty {
    padding: 12px;
    font-size: 15px;
    line-height: 1.4;
    color: #3D4A46;
  }

  /* 4. Chosen states (phone only) + Siguiente */
  .chips {
    list-style: none;
    margin: 0;
    padding: 0;
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 40px;
    padding: 0 12px 0 16px;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 999px;
    font-family: 'Figtree', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #121413;
    cursor: pointer;
  }
  .chip:focus-visible { outline: 3px solid #489E85; outline-offset: 2px; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 24px;
  }

  .count {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #3D4A46;
  }

  /* Shown instead of the count while nothing is chosen */
  .unsure-btn {
    height: 48px;
    padding: 0 24px;
    background: #FFFFFF;
    border: 1px solid #CAE8E6;
    border-radius: 999px;
    font-family: 'Figtree', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #121413;
    cursor: pointer;
    transition: border-color 160ms ease;
  }
  .unsure-btn:hover { border-color: #489E85; }
  .unsure-btn:focus-visible { outline: 3px solid #489E85; outline-offset: 2px; }
  .count[hidden], .unsure-btn[hidden] { display: none; }

  .next-btn {
    height: 56px;
    padding: 0 40px;
    border: 0;
    border-radius: 999px;
    background: #121413;
    color: #CAE8E6;
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .next-btn:hover:not(:disabled) { background: #2F7A64; color: #FFFFFF; }
  .next-btn:focus-visible { outline: 3px solid #489E85; outline-offset: 3px; }
  .next-btn:disabled {
    background: #CAE8E6;
    color: #3D4A46;
    cursor: not-allowed;
  }

  /* Small screens: map only (no side names), chosen states as chips,
     Siguiente stays reachable at the bottom */
  @media (max-width: 700px) {
    .page { padding: 20px 20px 0; }
    .container, .content { gap: 18px; }
    .hint { font-size: 16px; }
    .map { height: auto; }
    .labels, .leaders { display: none; }
    .chips { display: flex; }
    .actions {
      flex-direction: column;
      gap: 10px;
      position: sticky;
      bottom: 0;
      margin: 0 -20px;
      padding: 10px 20px 22px;
      background: #EEF9F5;
    }
    /* soft fade above the bar so the map/chips slide under it */
    .actions::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 24px;
      background: linear-gradient(rgba(238, 249, 245, 0), #EEF9F5);
      pointer-events: none;
    }
    .next-btn { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .state, .next-btn, .pick { transition: none; }
    .leader.is-drawing, .dot.is-new, .label.is-new,
    .leader.is-undrawing, .dot.is-leaving, .label.is-leaving { animation: none; stroke-dasharray: none; }
  }
</style>
</head>

<script>
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var MAP_W = 559.1, MAP_H = 760;

  /* Layout knobs (map units; the map is MAP_H tall) */
  var GUTTER = 250;        /* room for names left and right of the map */
  var NAME_GAP = 28;       /* map edge -> name */
  var LINE_GAP = 16;       /* map edge -> end of the line */
  var LINE_H = 28;         /* height of one line of a name */
  var NAME_SPACING = 14;   /* min. space between two names */
  var HIT_R_MOUSE = 18, HIT_R_TOUCH = 38;  /* tap circles for the city-states (38 = 44px on a phone) */
  var SIDE_LABELS = true;  /* names with a line beside the map */

  var VIEW_NARROW = [-8, -8, MAP_W + 16, MAP_H + 16].join(' ');
  var VIEW_WIDE = SIDE_LABELS ? [-GUTTER, -20, MAP_W + 2 * GUTTER, MAP_H + 40].join(' ') : VIEW_NARROW;

  var svg = document.getElementById('map');
  var leadersLayer = document.getElementById('leaders');
  var labelsLayer = document.getElementById('labels');
  var focusRing = document.getElementById('focus-ring');
  var countText = document.getElementById('count');
  var announce = document.getElementById('announce');
  var nextBtn = document.getElementById('next');
  var unsureBtn = document.getElementById('unsure');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var narrow = window.matchMedia('(max-width: 700px)');
  var coarse = window.matchMedia('(pointer: coarse)');

  var states = [];   /* one entry per state */
  var byId = {};
  var chosen = [];   /* in the order they were picked */
  var onToggle = []; /* extra things to update when a state is (un)chosen */
  var onHover = [];  /* extra things to update when a state is pointed at */

  Array.prototype.forEach.call(svg.querySelectorAll('.state'), function (path) {
    var s = {
      id: path.id,
      name: path.getAttribute('aria-label'),
      path: path,
      ax: parseFloat(path.getAttribute('data-x')),
      ay: parseFloat(path.getAttribute('data-y')),
      label: null
    };
    s.side = s.ax < MAP_W / 2 ? 'left' : 'right';
    /* Long names go on two lines, split at the hyphen */
    s.lines = s.name.length > 15 && s.name.indexOf('-') > 0
      ? [s.name.slice(0, s.name.indexOf('-') + 1), s.name.slice(s.name.indexOf('-') + 1)]
      : [s.name];
    s.h = s.lines.length * LINE_H;
    states.push(s);
    byId[s.id] = s;
  });

  /* ---------- Choosing ---------- */
  function toggle(s) {
    var i = chosen.indexOf(s);
    var on = i === -1;
    if (on) chosen.push(s); else chosen.splice(i, 1);
    s.path.setAttribute('aria-checked', String(on));
    flood(s, on);
    announce.textContent = s.name + (on ? ' elegido' : ' quitado');
    if (SIDE_LABELS) {
      if (on) addLabel(s); else removeLabel(s);
      layoutLabels();
    }
    onToggle.forEach(function (fn) { fn(s, on); });
    var n = chosen.length;
    countText.textContent = n === 0 ? 'Ningún estado elegido'
      : n === 1 ? '1 estado elegido' : n + ' estados elegidos';
    nextBtn.disabled = n === 0;
    /* "No lo sé" takes the count's place while nothing is chosen */
    countText.hidden = n === 0;
    unsureBtn.hidden = n !== 0;
  }

  function setHover(s, on) {
    s.path.classList.toggle('is-hover', on);
    onHover.forEach(function (fn) { fn(s, on); });
  }
  function hoverable(el, s) {
    el.addEventListener('pointerenter', function (e) {
      if (e.pointerType === 'mouse') setHover(s, true);
    });
    el.addEventListener('pointerleave', function () { setHover(s, false); });
  }

  states.forEach(function (s) {
    s.path.addEventListener('click', function () { toggle(s); });
    s.path.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(s); }
    });
    s.path.addEventListener('focus', function () {
      var visible = true;
      try { visible = s.path.matches(':focus-visible'); } catch (err) {}
      focusRing.setAttribute('d', s.path.getAttribute('d'));
      focusRing.classList.toggle('is-on', visible);
    });
    s.path.addEventListener('blur', function () { focusRing.classList.remove('is-on'); });
    hoverable(s.path, s);
  });

  Array.prototype.forEach.call(svg.querySelectorAll('.hit'), function (c) {
    var s = byId[c.getAttribute('data-for')];
    c.addEventListener('click', function () { toggle(s); });
    hoverable(c, s);
  });

  function setHitSize() {
    var r = coarse.matches ? HIT_R_TOUCH : HIT_R_MOUSE;
    Array.prototype.forEach.call(svg.querySelectorAll('.hit'), function (c) {
      c.setAttribute('r', r);
    });
  }

  function el(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  /* ---------- Green fill grows from the dot / shrinks back into it ---------- */
  /* A green circle centred on the dot (data-x/data-y), cut to the state's
     shape. Selecting: it grows until it covers the farthest corner of the
     state, then the state itself turns green and the circle is removed.
     Unselecting: the state turns white underneath and the circle shrinks back
     into the dot (the same animation backwards). Clicking again mid-way turns
     it around from where it is. */
  var FLOOD_MS = 550;   /* keep equal to the .flood-circle animation */
  var floodLayer = document.getElementById('floods');
  var floodClips = document.getElementById('flood-clips');

  function flood(s, growing) {
    /* how far an unfinished flood got, so the new one can continue from there */
    var startAt = 0;
    if (s.flood && s.flood.growing !== growing) {
      var running = s.flood.circle.getAnimations ? s.flood.circle.getAnimations()[0] : null;
      var elapsed = running && running.currentTime !== null ? running.currentTime : FLOOD_MS;
      startAt = Math.max(0, FLOOD_MS - Math.min(elapsed, FLOOD_MS));
    }
    stopFlood(s);
    if (reduceMotion.matches) return;
    if (startAt >= FLOOD_MS) return;   /* the other one had not started: nothing to show */
    var clipId = 'clip-' + s.id;
    if (!document.getElementById(clipId)) {
      var clip = el('clipPath', { id: clipId });
      clip.appendChild(el('path', { d: s.path.getAttribute('d'), 'clip-rule': 'evenodd' }));
      floodClips.appendChild(clip);
    }
    var b = s.path.getBBox();
    var r = Math.max(
      Math.hypot(b.x - s.ax, b.y - s.ay),
      Math.hypot(b.x + b.width - s.ax, b.y - s.ay),
      Math.hypot(b.x - s.ax, b.y + b.height - s.ay),
      Math.hypot(b.x + b.width - s.ax, b.y + b.height - s.ay)
    );
    var g = el('g', { 'clip-path': 'url(#' + clipId + ')' });
    var circle = el('circle', {
      'class': 'flood-circle' + (growing ? '' : ' is-shrinking'), cx: s.ax, cy: s.ay, r: r
    });
    if (startAt) circle.style.animationDelay = '-' + Math.round(startAt) + 'ms';
    g.appendChild(circle);
    /* the state's own border, redrawn on top so the circle never covers it */
    var outline = el('path', { 'class': 'flood-outline', d: s.path.getAttribute('d') });
    floodLayer.appendChild(g);
    floodLayer.appendChild(outline);
    if (growing) s.path.classList.add('is-flooding');   /* stays unselected-white underneath */

    var f = { circle: circle, growing: growing, parts: [g, outline], timers: [] };
    f.timers.push(setTimeout(function () {
      if (!growing) { stopFlood(s); return; }   /* shrunk into the dot: done */
      s.path.classList.remove('is-flooding');   /* turns green under the full circle */
      f.timers.push(setTimeout(function () { stopFlood(s); }, 200));
    }, FLOOD_MS - startAt));
    s.flood = f;
  }

  function stopFlood(s) {
    if (!s.flood) return;
    s.flood.timers.forEach(clearTimeout);
    s.flood.parts.forEach(function (p) { p.remove(); });
    s.path.classList.remove('is-flooding');
    s.flood = null;
  }

  /* ---------- Names with lines ---------- */

  function addLabel(s) {
    var left = s.side === 'left';
    var textX = left ? -NAME_GAP : MAP_W + NAME_GAP;
    var animate = !reduceMotion.matches;

    var g = el('g', { 'class': 'label' + (animate ? ' is-new' : '') });
    g.appendChild(el('rect', {
      'class': 'label-hit',
      x: left ? -GUTTER : MAP_W + LINE_GAP,
      y: -NAME_SPACING / 2,
      width: GUTTER - LINE_GAP,
      height: s.h + NAME_SPACING
    }));
    var text = el('text', { x: textX, 'text-anchor': left ? 'end' : 'start', lang: 'de' });
    s.lines.forEach(function (line, i) {
      var t = el('tspan', { x: textX, y: 20 + i * LINE_H });
      t.textContent = line;
      text.appendChild(t);
    });
    g.appendChild(text);
    g.addEventListener('click', function () { toggle(s); });

    var line = el('path', { 'class': 'leader' + (animate ? ' is-drawing' : ''), pathLength: 1 });
    var dot = el('circle', { 'class': 'dot' + (animate ? ' is-new' : ''), cx: s.ax, cy: s.ay, r: 5.5 });

    leadersLayer.appendChild(line);
    leadersLayer.appendChild(dot);
    labelsLayer.appendChild(g);

    /* The draw-in is only a start-up effect; drop it so later moves stay solid */
    if (animate) setTimeout(function () { line.classList.remove('is-drawing'); }, 700);

    s.label = { g: g, line: line, dot: dot, y: null, from: null, to: null };
  }

  function removeLabel(s) {
    var lb = s.label;
    s.label = null;
    if (!lb) return;
    var parts = [lb.g, lb.line, lb.dot];
    if (reduceMotion.matches) {
      parts.forEach(function (p) { p.remove(); });
      return;
    }
    /* Play the selecting animation backwards (see .is-leaving / .is-undrawing) */
    lb.g.classList.remove('is-new');
    lb.dot.classList.remove('is-new');
    lb.line.classList.remove('is-drawing');
    lb.g.classList.add('is-leaving');
    lb.dot.classList.add('is-leaving');
    lb.line.classList.add('is-undrawing');
    setTimeout(function () { parts.forEach(function (p) { p.remove(); }); }, 460);
  }

  /* Each side: names sorted top-to-bottom by their state, as close to the
     state's height as possible, pushed apart so they never overlap. */
  function layoutLabels() {
    ['left', 'right'].forEach(function (side) {
      var items = chosen.filter(function (s) { return s.side === side; })
        .sort(function (a, b) { return a.ay - b.ay; });
      var floor = -10;
      items.forEach(function (s) {
        s.label.to = Math.max(s.ay - s.h / 2, floor);
        floor = s.label.to + s.h + NAME_SPACING;
      });
      var ceiling = MAP_H + 10;
      for (var i = items.length - 1; i >= 0; i--) {
        var lb = items[i].label;
        if (lb.to + items[i].h > ceiling) lb.to = ceiling - items[i].h;
        ceiling = lb.to - NAME_SPACING;
      }
    });
    startMove();
  }

  function leaderPath(s, top) {
    var ex = s.side === 'left' ? -LINE_GAP : MAP_W + LINE_GAP;
    var ey = top + s.h / 2 - 1;
    var mx = s.ax + (ex - s.ax) * 0.5;
    return 'M' + s.ax + ' ' + s.ay + 'C' + mx + ' ' + s.ay + ' ' + mx + ' ' + ey + ' ' + ex + ' ' + ey;
  }

  function place(s, top) {
    s.label.y = top;
    s.label.g.setAttribute('transform', 'translate(0 ' + top + ')');
    s.label.line.setAttribute('d', leaderPath(s, top));
  }

  var moveStart = 0, moving = false, MOVE_MS = 320;
  function startMove() {
    chosen.forEach(function (s) {
      var lb = s.label;
      lb.from = lb.y === null ? lb.to : lb.y;   /* new names start where they belong */
    });
    if (reduceMotion.matches) {
      chosen.forEach(function (s) { place(s, s.label.to); });
      return;
    }
    moveStart = performance.now();
    if (!moving) { moving = true; requestAnimationFrame(step); }
  }
  function step(now) {
    var t = Math.min(1, (now - moveStart) / MOVE_MS);
    var e = 1 - Math.pow(1 - t, 3);
    chosen.forEach(function (s) {
      var lb = s.label;
      place(s, lb.from + (lb.to - lb.from) * e);
    });
    if (t < 1) requestAnimationFrame(step); else moving = false;
  }

  /* ---------- Phone: chosen states as chips ---------- */
  var chipsList = document.getElementById('chips');
  function renderChips() {
    chipsList.textContent = '';
    chosen.forEach(function (s) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('aria-label', 'Quitar ' + s.name);
      var name = document.createElement('span');
      name.lang = 'de';
      name.textContent = s.name;
      b.appendChild(name);
      b.insertAdjacentHTML('beforeend',
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>');
      b.addEventListener('click', function () {
        var i = chosen.indexOf(s);
        toggle(s);
        /* keep keyboard focus in the list after a chip disappears */
        var chips = chipsList.querySelectorAll('.chip');
        if (chips.length) chips[Math.min(i, chips.length - 1)].focus();
        else nextBtn.focus();
      });
      li.appendChild(b);
      chipsList.appendChild(li);
    });
  }
  onToggle.push(renderChips);

  /* ---------- Option C: search by city ---------- */
  /* City|state|other spellings (Spanish/English). Larger German cities; a
     city that isn't here can still be picked on the map. */
  var CITIES = [
    'Berlin|BE|Berlín', 'Hamburg|HH|Hamburgo', 'München|BY|Múnich,Munich', 'Köln|NW|Colonia,Cologne',

    'Mönchengladbach|NW', 'Gelsenkirchen|NW', 'Aachen|NW|Aquisgrán', 'Braunschweig|NI|Brunswick',
    'Kiel|SH', 'Chemnitz|SN', 'Halle (Saale)|ST|Halle', 'Magdeburg|ST|Magdeburgo',

    'Erfurt|TH', 'Oberhausen|NW', 'Rostock|MV', 'Kassel|HE', 'Hagen|NW', 'Potsdam|BB',
    'Saarbrücken|SL', 'Hamm|NW', 'Ludwigshafen am Rhein|RP|Ludwigshafen', 'Mülheim an der Ruhr|NW|Mülheim',
    'Oldenburg|NI', 'Osnabrück|NI', 'Leverkusen|NW', 'Darmstadt|HE', 'Heidelberg|BW', 'Solingen|NW',
    'Herne|NW', 'Regensburg|BY|Ratisbona', 'Neuss|NW', 'Paderborn|NW', 'Ingolstadt|BY',
    'Offenbach am Main|HE|Offenbach', 'Fürth|BY', 'Würzburg|BY|Wurzburgo', 'Ulm|BW', 'Heilbronn|BW',
    'Pforzheim|BW', 'Wolfsburg|NI', 'Göttingen|NI|Gotinga', 'Bottrop|NW', 'Reutlingen|BW', 'Erlangen|BY',
    'Bremerhaven|HB', 'Koblenz|RP|Coblenza', 'Bergisch Gladbach|NW', 'Recklinghausen|NW', 'Jena|TH',
    'Remscheid|NW', 'Trier|RP|Tréveris', 'Salzgitter|NI', 'Moers|NW', 'Siegen|NW', 'Hildesheim|NI',
    'Cottbus|BB', 'Gütersloh|NW', 'Kaiserslautern|RP', 'Witten|NW', 'Hanau|HE', 'Schwerin|MV', 'Gera|TH',
    'Esslingen am Neckar|BW|Esslingen', 'Ludwigsburg|BW', 'Iserlohn|NW', 'Düren|NW', 'Tübingen|BW',
    'Zwickau|SN', 'Flensburg|SH', 'Gießen|HE', 'Ratingen|NW', 'Lünen|NW', 'Villingen-Schwenningen|BW',
    'Konstanz|BW|Constanza', 'Marl|NW', 'Worms|RP', 'Minden|NW', 'Velbert|NW', 'Neumünster|SH',
    'Dessau-Roßlau|ST|Dessau', 'Norderstedt|SH', 'Delmenhorst|NI', 'Bamberg|BY', 'Viersen|NW',
    'Marburg|HE', 'Rheine|NW', 'Wilhelmshaven|NI', 'Gladbeck|NW', 'Lüneburg|NI', 'Troisdorf|NW',
    'Bayreuth|BY', 'Dorsten|NW', 'Detmold|NW', 'Arnsberg|NW', 'Castrop-Rauxel|NW', 'Landshut|BY',
    'Brandenburg an der Havel|BB', 'Bocholt|NW', 'Aschaffenburg|BY', 'Celle|NI', 'Kempten (Allgäu)|BY|Kempten',
    'Fulda|HE', 'Lippstadt|NW', 'Aalen|BW', 'Dinslaken|NW', 'Herford|NW', 'Rüsselsheim am Main|HE|Rüsselsheim',
    'Kerpen|NW', 'Weimar|TH', 'Sindelfingen|BW', 'Neuwied|RP', 'Plauen|SN', 'Dormagen|NW', 'Grevenbroich|NW',
    'Rosenheim|BY', 'Neubrandenburg|MV', 'Friedrichshafen|BW', 'Herten|NW', 'Bergheim|NW',
    'Schwäbisch Gmünd|BW', 'Garbsen|NI', 'Wesel|NW', 'Hürth|NW', 'Offenburg|BW', 'Stralsund|MV',
    'Greifswald|MV', 'Langenfeld (Rheinland)|NW|Langenfeld', 'Neu-Ulm|BY', 'Unna|NW', 'Euskirchen|NW',
    'Frankfurt (Oder)|BB', 'Göppingen|BW', 'Hameln|NI|Hamelín', 'Görlitz|SN', 'Sankt Augustin|NW',
    'Hilden|NW', 'Meerbusch|NW', 'Gotha|TH', 'Wismar|MV', 'Halberstadt|ST', 'Stendal|ST',
    'Lutherstadt Wittenberg|ST|Wittenberg', 'Speyer|RP|Espira', 'Landau in der Pfalz|RP|Landau',
    'Passau|BY', 'Freising|BY', 'Straubing|BY', 'Schweinfurt|BY', 'Coburg|BY|Coburgo', 'Hof|BY',
    'Memmingen|BY', 'Kaufbeuren|BY', 'Garmisch-Partenkirchen|BY', 'Amberg|BY', 'Ansbach|BY',
    'Weiden in der Oberpfalz|BY|Weiden', 'Neumarkt in der Oberpfalz|BY|Neumarkt', 'Deggendorf|BY',
    'Dachau|BY', 'Erding|BY', 'Fürstenfeldbruck|BY', 'Starnberg|BY', 'Lindau (Bodensee)|BY|Lindau',
    'Baden-Baden|BW', 'Lörrach|BW', 'Ravensburg|BW', 'Heidenheim an der Brenz|BW|Heidenheim',
    'Schwäbisch Hall|BW', 'Böblingen|BW', 'Waiblingen|BW', 'Rastatt|BW', 'Bruchsal|BW',
    'Biberach an der Riß|BW|Biberach', 'Singen (Hohentwiel)|BW|Singen',
    'Emden|NI', 'Lingen (Ems)|NI|Lingen', 'Cuxhaven|NI', 'Stade|NI', 'Wolfenbüttel|NI', 'Goslar|NI',
    'Peine|NI', 'Nordhorn|NI', 'Gifhorn|NI', 'Leer (Ostfriesland)|NI|Leer', 'Aurich|NI', 'Uelzen|NI',
    'Husum|SH', 'Itzehoe|SH', 'Elmshorn|SH', 'Pinneberg|SH', 'Schleswig|SH', 'Bad Segeberg|SH',
    'Suhl|TH', 'Nordhausen|TH', 'Eisenach|TH', 'Altenburg|TH', 'Ilmenau|TH',
    'Weißenfels|ST', 'Merseburg|ST', 'Wernigerode|ST', 'Quedlinburg|ST', 'Bitterfeld-Wolfen|ST',
    'Bautzen|SN', 'Freiberg|SN', 'Pirna|SN', 'Meißen|SN', 'Riesa|SN',
    'Eberswalde|BB', 'Oranienburg|BB', 'Neuruppin|BB', 'Bernau bei Berlin|BB|Bernau',
    'Güstrow|MV', 'Waren (Müritz)|MV|Waren',
    'Neunkirchen (Saar)|SL|Neunkirchen', 'Homburg (Saar)|SL|Homburg', 'Völklingen|SL', 'Saarlouis|SL',
    'St. Ingbert|SL|Sankt Ingbert', 'Merzig|SL',
    'Wetzlar|HE', 'Bad Homburg vor der Höhe|HE|Bad Homburg', 'Limburg an der Lahn|HE|Limburg',
    'Idar-Oberstein|RP', 'Pirmasens|RP', 'Zweibrücken|RP', 'Bingen am Rhein|RP|Bingen',
    'Bad Kreuznach|RP', 'Frankenthal (Pfalz)|RP|Frankenthal', 'Neustadt an der Weinstraße|RP',
    'Lüdenscheid|NW', 'Siegburg|NW', 'Hattingen|NW', 'Kleve|NW', 'Ahlen|NW', 'Bad Oeynhausen|NW'
  ];
  /* Other names for the states themselves, so "Baviera" finds Bayern */
  var STATE_ALIASES = {
    'st-bw': 'Baden-Wurtemberg', 'st-by': 'Baviera,Bavaria', 'st-be': 'Berlín',
    'st-bb': 'Brandeburgo', 'st-hh': 'Hamburgo', 'st-he': 'Hesse',
    'st-mv': 'Mecklemburgo-Pomerania Occidental,Mecklemburgo', 'st-ni': 'Baja Sajonia,Lower Saxony',
    'st-nw': 'Renania del Norte-Westfalia,NRW,North Rhine-Westphalia',
    'st-rp': 'Renania-Palatinado,Rhineland-Palatinate', 'st-sl': 'Sarre', 'st-sn': 'Sajonia,Saxony',
    'st-st': 'Sajonia-Anhalt,Saxony-Anhalt', 'st-th': 'Turingia,Thuringia'
  };

  /* "Köln", "koln" and "koeln" all become the same search key */
  function plain(t) {
    return t.toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function umlautSpelled(t) {
    return t.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue');
  }
  function keysFor(names) {
    var keys = [];
    names.forEach(function (n, i) {
      [plain(n), plain(umlautSpelled(n))].forEach(function (k) {
        keys.push({ key: k, alias: i > 0 ? n : null });
      });
    });
    return keys;
  }

  var entries = [];
  states.forEach(function (s) {
    var names = [s.name].concat(STATE_ALIASES[s.id] ? STATE_ALIASES[s.id].split(',') : []);
    entries.push({ label: s.name, state: s, isState: true, keys: keysFor(names), order: -1 });
  });
  CITIES.forEach(function (row, i) {
    var p = row.split('|');
    var state = byId['st-' + p[1].toLowerCase()];
    if (plain(p[0]) === plain(state.name)) return;   /* Berlin, Hamburg, Bremen: the state already covers it */
    var names = [p[0]].concat(p[2] ? p[2].split(',') : []);
    entries.push({ label: p[0], state: state, isState: false, keys: keysFor(names), order: i });
  });

  /* Best match first: states before cities, whole name before a later word,
     bigger cities (earlier in the list) before smaller ones */
  function search(query) {
    var q = plain(query);
    if (!q) return [];
    var hits = [];
    entries.forEach(function (e) {
      var best = null;
      e.keys.forEach(function (k) {
        var rank = k.key.indexOf(q) === 0 ? 0
          : (' ' + k.key).indexOf(' ' + q) !== -1 ? 1 : -1;
        if (rank !== -1 && (!best || rank < best.rank || (rank === best.rank && best.alias && !k.alias))) {
          best = { rank: rank, alias: k.alias };
        }
      });
      if (best) hits.push({ e: e, rank: best.rank, alias: best.alias });
    });
    hits.sort(function (a, b) {
      return (a.e.isState === b.e.isState ? 0 : a.e.isState ? -1 : 1)
        || a.rank - b.rank || a.e.order - b.e.order;
    });
    return hits.slice(0, 6);
  }

  var input = document.getElementById('city');
  var list = document.getElementById('city-list');
  var hint = document.getElementById('hint');
  var results = [];
  var active = -1;

  function open(isOpen) {
    list.hidden = !isOpen;
    input.setAttribute('aria-expanded', String(isOpen));
    if (!isOpen) { active = -1; input.removeAttribute('aria-activedescendant'); }
  }

  function render() {
    results = search(input.value);
    list.textContent = '';
    if (!plain(input.value)) { open(false); return; }
    if (!results.length) {
      var empty = document.createElement('li');
      empty.className = 'suggestion-empty';
      empty.setAttribute('role', 'presentation');
      empty.textContent = 'No encontramos esa ciudad. Prueba con una ciudad grande cercana, o toca el estado en el mapa.';
      list.appendChild(empty);
      open(true);
      return;
    }
    results.forEach(function (r, i) {
      var li = document.createElement('li');
      li.className = 'suggestion';
      li.id = 'city-opt-' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(i === active));
      var city = document.createElement('span');
      city.className = 'suggestion-city';
      city.lang = 'de';
      city.textContent = r.e.label;
      if (r.alias) {
        var alias = document.createElement('span');
        alias.className = 'suggestion-alias';
        alias.lang = 'es';
        alias.textContent = ' · ' + r.alias;
        city.appendChild(alias);
      }
      var st = document.createElement('span');
      st.className = 'suggestion-state';
      st.lang = 'de';
      st.textContent = r.e.isState ? 'Estado' : r.e.state.name;
      li.appendChild(city);
      li.appendChild(st);
      /* pointerdown + preventDefault keeps focus in the box */
      li.addEventListener('pointerdown', function (e) { e.preventDefault(); });
      li.addEventListener('click', function () { choose(r.e); });
      list.appendChild(li);
    });
    open(true);
  }

  function setActive(i) {
    active = i;
    Array.prototype.forEach.call(list.querySelectorAll('.suggestion'), function (li, j) {
      li.setAttribute('aria-selected', String(j === i));
    });
    if (i >= 0) input.setAttribute('aria-activedescendant', 'city-opt-' + i);
    else input.removeAttribute('aria-activedescendant');
  }

  function choose(e) {
    if (chosen.indexOf(e.state) === -1) toggle(e.state);   /* never un-chooses */
    var msg = e.isState
      ? e.state.name + ' elegido.'
      : e.label + ' está en ' + e.state.name + ' (elegido).';
    hint.textContent = msg;
    announce.textContent = msg;
    input.value = '';
    open(false);
  }

  input.addEventListener('input', function () { active = -1; render(); });
  input.addEventListener('focus', function () { if (input.value) render(); });
  input.addEventListener('blur', function () { open(false); });
  input.addEventListener('keydown', function (e) {
    var n = results.length;
    if (e.key === 'ArrowDown' && n) {
      e.preventDefault();
      if (list.hidden) render();
      setActive(active < n - 1 ? active + 1 : 0);
    } else if (e.key === 'ArrowUp' && n) {
      e.preventDefault();
      setActive(active > 0 ? active - 1 : n - 1);
    } else if (e.key === 'Enter') {
      if (!list.hidden && n) { e.preventDefault(); choose(results[active >= 0 ? active : 0].e); }
    } else if (e.key === 'Escape') {
      if (!list.hidden) open(false); else input.value = '';
    }
  });

  /* ---------- Screen size ---------- */
  function setView() { svg.setAttribute('viewBox', narrow.matches ? VIEW_NARROW : VIEW_WIDE); }
  function onChange(mq, fn) {
    if (mq.addEventListener) mq.addEventListener('change', fn); else mq.addListener(fn);
  }
  onChange(narrow, setView);
  onChange(coarse, setHitSize);
  setView();
  setHitSize();

  /* ---------- Siguiente / No lo sé ---------- */
  /* The choice is kept in this browser (localStorage "mn_estados") so that
     berlin.html can list it under "Tus estados": [{id:"by", name:"Bayern"}, ...]
     in the order picked. "No lo sé" saves an empty list. */
  function saveChoice(list) {
    try { localStorage.setItem('mn_estados', JSON.stringify(list)); } catch (e) {}
  }

  nextBtn.addEventListener('click', function () {
    if (!chosen.length) return;
    saveChoice(chosen.map(function (s) { return { id: s.id.slice(3), name: s.name }; }));
    window.location.href = 'berlin.html';
  });

  unsureBtn.addEventListener('click', function () {
    saveChoice([]);
    window.location.href = 'berlin.html';
  });
})();
</script>
